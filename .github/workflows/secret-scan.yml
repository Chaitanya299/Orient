name: secret-scan

# Fail the build if a secret is ever committed. orient ships none, so this stays
# green — its job is to stop a future accidental leak from reaching the public repo.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2 — pinned to a full commit SHA (tags are mutable).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2.3.9 — pinned to a full commit SHA.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7

  version-sync:
    # ADR-0011: plugin.json and package.json must agree before anything ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node scripts/check-version.mjs
